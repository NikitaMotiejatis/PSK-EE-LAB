<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
    <title>Optimistic locking demo</title>
</h:head>
<h:body>
    <h2>Optimistic locking demo</h2>
    <p>
        Simulates: User B loads a player, User A commits an update, then User B tries to save its stale snapshot.
        The merge throws OptimisticLockException; the demo then performs proper recovery in a fresh transaction.
    </p>

    <h:form>
        <h:commandButton value="Run demo" action="#{optimisticLockingDemo.run()}"/>
    </h:form>

    <h3>Log</h3>
    <pre>#{optimisticLockingDemo.log}</pre>
    <h:link outcome="index" value="Back to home page"/>
</h:body>
</html>
